[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-task-bot"
version = "0.1.0"
description = "Telegram bot for team chat task extraction and management"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.13.1",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "redis==5.2.1",
    "apscheduler==3.10.4",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "httpx==0.28.1",
    "openai==1.57.4",
    "python-dateutil==2.9.0",
    "pytz==2024.2",
    "structlog==24.4.0",
    "prometheus-client==0.21.1",
    "aiosqlite==0.20.0",
    "greenlet==3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "pytest-cov==6.0.0",
    "pyyaml==6.0.2",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-pytz==2024.2.0.20241221",
    "types-python-dateutil==2.9.0.20241206",
    "eval_type_backport==0.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy evaluates Mapped[...] annotations at runtime; PEP 604 "X | None"
# breaks on the Python 3.9 dev interpreter, so keep Optional/List here.
"app/db/models.py" = ["UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.coverage.run]
# SQLAlchemy's async layer runs on greenlets; without this, lines after an await look unexecuted.
concurrency = ["greenlet", "thread"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
